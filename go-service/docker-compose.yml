version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: school-mgmt-postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      # SQL init scripts (executed on first init)
      - ./seed_db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 30

  node-backend:
    image: node:18-alpine
    container_name: school-mgmt-node
    working_dir: /app
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5007:5007"
    volumes:
      - ../react-node/backend:/app
    command: sh -lc "npm install && npm start"

volumes:
  pg_data:
